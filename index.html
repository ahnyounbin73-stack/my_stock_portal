<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글로벌 마켓 & 주식 인텔리전스 포털</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --border: #2d3748;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --up-green: #10b981;
      --down-red: #ef4444;
      --ma20: #f59e0b;
      --ma60: #a855f7;
      --ma120: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .portal-nav { background: #0d1322; border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-shrink: 0; }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .brand-title { font-size: 16px; font-weight: 800; color: #fff; }
    
    .search-container { flex: 1; max-width: 500px; position: relative; }
    .search-box { width: 100%; background: #1a2234; border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px 8px 36px; font-size: 13px; color: #fff; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }
    .search-dropdown { position: absolute; top: 40px; left: 0; width: 100%; background: #1a2234; border: 1px solid var(--border); border-radius: 10px; max-height: 350px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .search-item { padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .search-item:hover { background: #26334d; }
    
    .subnav-bar { background: #0f172a; border-bottom: 1px solid var(--border); padding: 8px 24px; display: flex; align-items: center; gap: 14px; overflow-x: auto; flex-shrink: 0; }
    .cat-tabs { display: flex; gap: 6px; border-right: 1px solid var(--border); padding-right: 14px; flex-shrink: 0; }
    .cat-tab { background: transparent; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .cat-tab.active { color: #fff; background: var(--accent); }
    .ticker-chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .chip { background: #1e293b; border: 1px solid var(--border); color: #cbd5e1; font-size: 11px; padding: 4px 10px; border-radius: 14px; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #2563eb; color: #fff; font-weight: 700; border-color: #3b82f6; }
    
    .entity-header { background: #111827; border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .entity-title-group { display: flex; align-items: baseline; gap: 10px; }
    .entity-name { font-size: 18px; font-weight: 800; color: #fff; }
    .entity-ticker { font-size: 13px; color: var(--accent); font-weight: 700; }
    .metrics-row { display: flex; gap: 16px; font-size: 12px; }
    .metric-cell { display: flex; flex-direction: column; align-items: flex-end; }
    .metric-lbl { font-size: 10px; color: var(--text-muted); }
    .metric-val { font-weight: 700; }
    
    .milestone-bar { background: #0b111e; border-bottom: 1px solid var(--border); padding: 6px 24px; display: flex; align-items: center; gap: 8px; overflow-x: auto; flex-shrink: 0; }
    .ms-label { font-size: 11px; font-weight: 700; color: #f59e0b; white-space: nowrap; }
    .ms-btn { background: #1a2333; border: 1px solid #334155; color: #cbd5e1; padding: 3px 9px; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .ms-btn:hover { border-color: #f59e0b; color: #fff; }
    
    .workspace { display: flex; flex: 1; overflow: hidden; }
    .chart-section { flex: 1; display: flex; flex-direction: column; position: relative; background: #090d16; border-right: 1px solid var(--border); }
    .chart-toolbar { background: #111827; border-bottom: 1px solid var(--border); padding: 6px 16px; display: flex; justify-content: space-between; font-size: 11px; }
    .canvas-container { flex: 1; position: relative; cursor: crosshair; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .analysis-panel { width: 440px; background: #111827; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
    .panel-top { background: #161f30; border-bottom: 1px solid var(--border); padding: 14px 18px; }
    .panel-instruction { font-size: 11px; color: var(--accent); background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }
    .panel-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .panel-date { font-size: 17px; font-weight: 800; color: #fff; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
    .badge-up { background: rgba(16, 185, 129, 0.15); color: var(--up-green); border: 1px solid var(--up-green); }
    .badge-down { background: rgba(239, 68, 68, 0.15); color: var(--down-red); border: 1px solid var(--down-red); }
    .panel-close { font-size: 24px; font-weight: 900; }
    .panel-diff { font-size: 13px; font-weight: 700; margin-left: 10px; }
    
    .ohlc-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 18px; background: #1a2333; border-bottom: 1px solid var(--border); }
    .ohlc-l { font-size: 10px; color: var(--text-muted); }
    .ohlc-v { font-size: 12px; font-weight: 700; }
    
    .panel-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .factor-card { background: #182232; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .factor-title { font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
    .factor-desc { font-size: 12px; line-height: 1.55; color: #e2e8f0; }
    .pillar-item { margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.08); }
    .pillar-hdr { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 2px; }
    .pillar-txt { font-size: 11.5px; color: #cbd5e1; line-height: 1.45; }
  </style>
</head>
<body>

  <header class="portal-nav">
    <div class="nav-brand">
      <div class="brand-icon">🌐</div>
      <div class="brand-title">MARKET INTELLIGENCE PORTAL</div>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-box" id="searchInput" placeholder="종목명, 티커 검색 (예: 삼성전자, NVDA, 코스피, 브로드컴...)">
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <button class="chip" onclick="toggleColorMode()" id="colorToggleBtn">🎨 미국식(녹/적)</button>
  </header>

  <div class="subnav-bar">
    <div class="cat-tabs">
      <button class="cat-tab active" onclick="filterCategory('ALL')">전체 (18)</button>
      <button class="cat-tab" onclick="filterCategory('INDEX')">🌐 지수</button>
      <button class="cat-tab" onclick="filterCategory('US_TECH')">🇺🇸 미국 테크</button>
      <button class="cat-tab" onclick="filterCategory('KR_GIANT')">🇰🇷 국내 대기업</button>
    </div>
    <div class="ticker-chips" id="tickerChipsContainer"></div>
  </div>

  <div class="entity-header">
    <div class="entity-title-group">
      <div class="entity-name" id="entName">데이터 로딩 중...</div>
      <div class="entity-ticker" id="entTicker"></div>
    </div>
    <div class="metrics-row">
      <div class="metric-cell"><span class="metric-lbl">종가</span><span class="metric-val" id="entCurrent">-</span></div>
      <div class="metric-cell"><span class="metric-lbl">52주 최고</span><span class="metric-val" id="ent52High" style="color:var(--up-green);">-</span></div>
      <div class="metric-cell"><span class="metric-lbl">52주 최저</span><span class="metric-val" id="ent52Low" style="color:var(--down-red);">-</span></div>
      <div class="metric-cell"><span class="metric-lbl">시총</span><span class="metric-val" id="entCap">-</span></div>
      <div class="metric-cell"><span class="metric-lbl">PER</span><span class="metric-val" id="entPE">-</span></div>
    </div>
  </div>

  <div class="milestone-bar">
    <div class="ms-label">📌 주요 변곡점:</div>
    <div id="milestonesContainer" style="display:flex; gap:8px; overflow-x:auto;"></div>
  </div>

  <div class="workspace">
    <div class="chart-section">
      <div class="chart-toolbar">
        <span style="font-weight:700; color:#fff;" id="chartTitle">일봉 차트</span>
        <div>
          <button class="chip" onclick="resetZoom()">🔍 전체</button>
          <button class="chip" onclick="zoomIn()">➕ 확대</button>
          <button class="chip" onclick="zoomOut()">➖ 축소</button>
        </div>
      </div>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <div class="analysis-panel">
      <div class="panel-top">
        <div class="panel-instruction">💡 일봉 클릭 또는 <b>⌨️ 키보드 좌우 방향키(←, →)</b>로 편리하게 일봉을 이동할 수 있습니다. (↑, ↓: 줌)</div>
        <div class="panel-header-row">
          <span class="panel-date" id="pDate">-</span>
          <span class="badge badge-up" id="pBadge">-</span>
        </div>
        <div style="display:flex; align-items:baseline;">
          <span class="panel-close" id="pClose">-</span>
          <span class="panel-diff" id="pDiff">-</span>
        </div>
      </div>

      <div class="ohlc-strip">
        <div><div class="ohlc-l">시가</div><div class="ohlc-v" id="pOpen">-</div></div>
        <div><div class="ohlc-l">고가</div><div class="ohlc-v" id="pHigh">-</div></div>
        <div><div class="ohlc-l">저가</div><div class="ohlc-v" id="pLow">-</div></div>
        <div><div class="ohlc-l">거래량</div><div class="ohlc-v" id="pVol">-</div></div>
      </div>

      <div class="panel-body">
        <div class="factor-card">
          <div class="factor-title">🎯 핵심 변동 원인</div>
          <div class="factor-desc" id="pHeadline">-</div>
        </div>
        <div class="factor-card">
          <div class="factor-title">🔍 4대 영역별 상세 분석</div>
          <div class="pillar-item"><div class="pillar-hdr">🏢 기업 실적 및 사업 동향</div><div class="pillar-txt" id="pPillarCompany">-</div></div>
          <div class="pillar-item"><div class="pillar-hdr">🌐 전방 산업 및 밸류체인</div><div class="pillar-txt" id="pPillarIndustry">-</div></div>
          <div class="pillar-item"><div class="pillar-hdr">🏛️ 거시 경제 및 금리/환율</div><div class="pillar-txt" id="pPillarMacro">-</div></div>
          <div class="pillar-item"><div class="pillar-hdr">📊 시장 수급 및 기술적 위치</div><div class="pillar-txt" id="pPillarTech">-</div></div>
        </div>
        <div class="factor-card">
          <div class="factor-title">💡 시장 시사점</div>
          <div class="factor-desc" id="pTakeaway">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let database = {};
    let currentTicker = "AVGO";
    let isKoreanColor = false;
    let selectedIndex = 0;
    let hoveredIndex = -1;
    let visibleCount = 100;
    let startIndex = 0;
    let isDragging = false, dragStartX = 0, dragStartStartIndex = 0;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const searchInput = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('searchDropdown');

    async function loadData() {
      try {
        const res = await fetch('./portal_database.json?v=' + Date.now());
        if (res.ok) {
          database = await res.json();
          initApp();
        } else {
          throw new Error('데이터 파일을 찾을 수 없습니다.');
        }
      } catch (err) {
        console.warn('portal_database.json 로딩 대기 중...', err);
        document.getElementById('entName').innerText = "portal_database.json 로딩 중...";
      }
    }

    function initApp() {
      renderTickerChips();
      selectEntity(Object.keys(database)[0] || "AVGO");
      setupKeyboard();
    }

    // ⌨️ 키보드 방향키 조작 이벤트 등록
    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        if (!database[currentTicker]) return;
        const series = database[currentTicker].series;
        if (!series || series.length === 0) return;
        if (document.activeElement === searchInput) return;

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (selectedIndex > 0) {
            selectedIndex--;
            if (selectedIndex < startIndex) {
              startIndex = Math.max(0, selectedIndex - 5);
            }
            updateAnalysisPanel(selectedIndex);
          }
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (selectedIndex < series.length - 1) {
            selectedIndex++;
            if (selectedIndex >= startIndex + visibleCount) {
              startIndex = Math.min(series.length - visibleCount, selectedIndex - visibleCount + 6);
            }
            updateAnalysisPanel(selectedIndex);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          zoomIn();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          zoomOut();
        }
      });
    }

    let activeCategory = "ALL";
    function renderTickerChips() {
      const wrapper = document.getElementById('tickerChipsContainer');
      wrapper.innerHTML = "";
      Object.keys(database).forEach(tk => {
        const ent = database[tk].meta;
        if (activeCategory === "ALL" || ent.category === activeCategory) {
          const btn = document.createElement('button');
          btn.className = "chip" + (tk === currentTicker ? " active" : "");
          btn.innerHTML = `${ent.name.split(' ')[0]} <span style="opacity:0.5;font-size:10px;">${tk}</span>`;
          btn.onclick = () => selectEntity(tk);
          wrapper.appendChild(btn);
        }
      });
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderTickerChips();
    }

    function selectEntity(tk) {
      if (!database[tk]) return;
      currentTicker = tk;
      const m = database[tk].meta;
      const s = database[tk].series;

      document.getElementById('entName').innerText = m.name;
      document.getElementById('entTicker').innerText = m.region + " : " + m.ticker;

      const pfx = m.currency === "USD" ? "$" : "";
      const sfx = m.currency === "KRW" ? "원" : "";

      document.getElementById('entCurrent').innerText = pfx + (m.currency==="USD" ? m.current.toFixed(2) : Number(m.current).toLocaleString()) + sfx;
      document.getElementById('ent52High').innerText = pfx + (m.currency==="USD" ? m.high_52w.toFixed(2) : Number(m.high_52w).toLocaleString()) + sfx;
      document.getElementById('ent52Low').innerText = pfx + (m.currency==="USD" ? m.low_52w.toFixed(2) : Number(m.low_52w).toLocaleString()) + sfx;
      document.getElementById('entCap').innerText = m.market_cap;
      document.getElementById('entPE').innerText = m.pe;
      document.getElementById('chartTitle').innerText = `${m.name} 1년 일봉 차트`;

      const msWrap = document.getElementById('milestonesContainer');
      msWrap.innerHTML = "";
      (m.milestones || []).forEach(([mDate, mText]) => {
        const btn = document.createElement('button');
        btn.className = "ms-btn";
        btn.innerText = `${mDate.substring(5)} ${mText.substring(0, 16)}...`;
        btn.onclick = () => jumpToDate(mDate);
        msWrap.appendChild(btn);
      });

      renderTickerChips();
      visibleCount = 100;
      startIndex = Math.max(0, s.length - visibleCount);
      selectedIndex = s.length - 1;

      updateAnalysisPanel(selectedIndex);
      resizeCanvas();
    }

    function getMA(series, period) {
      const ma = [];
      for (let i = 0; i < series.length; i++) {
        if (i < period - 1) ma.push(null);
        else {
          let sum = 0;
          for (let j = 0; j < period; j++) sum += series[i - j].close;
          ma.push(sum / period);
        }
      }
      return ma;
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      renderChart();
    }
    window.addEventListener('resize', resizeCanvas);

    function renderChart() {
      if (!database[currentTicker]) return;
      const series = database[currentTicker].series;
      const meta = database[currentTicker].meta;
      const ma20 = getMA(series, 20);
      const ma60 = getMA(series, 60);
      const ma120 = getMA(series, 120);

      const rect = container.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);

      const priceH = height * 0.73;
      const volTop = height * 0.77;
      const volH = height * 0.17;
      const rightPadding = 75;
      const chartWidth = width - rightPadding;

      const endIndex = Math.min(series.length, startIndex + visibleCount);
      const visibleData = series.slice(startIndex, endIndex);
      if (visibleData.length === 0) return;

      let minP = Infinity, maxP = -Infinity, maxV = 0;
      for (let i = startIndex; i < endIndex; i++) {
        const d = series[i];
        if (d.low < minP) minP = d.low;
        if (d.high > maxP) maxP = d.high;
        if (d.volume > maxV) maxV = d.volume;
      }
      const pPad = (maxP - minP) * 0.08 || 10;
      minP -= pPad; maxP += pPad;

      function getY(p) { return priceH - ((p - minP) / (maxP - minP)) * priceH; }
      function getVY(v) { return (volTop + volH) - (v / (maxV || 1)) * volH; }

      const candleW = chartWidth / visibleData.length;
      const bodyW = Math.max(2, candleW * 0.7);

      ctx.lineWidth = 1; ctx.strokeStyle = '#1e293b'; ctx.font = '11px sans-serif'; ctx.fillStyle = '#64748b';
      for (let s = 0; s <= 5; s++) {
        const val = minP + (maxP - minP) * (s / 5);
        const y = getY(val);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartWidth, y); ctx.stroke();
        const fmt = meta.currency === "USD" ? "$" + val.toFixed(1) : Math.round(val).toLocaleString();
        ctx.fillText(fmt, chartWidth + 6, y + 4);
      }

      const upColor = isKoreanColor ? '#ef4444' : '#10b981';
      const downColor = isKoreanColor ? '#3b82f6' : '#ef4444';

      for (let i = 0; i < visibleData.length; i++) {
        const gIdx = startIndex + i;
        const d = visibleData[i];
        const x = i * candleW + candleW / 2;
        const isUp = d.close >= d.open;
        const color = isUp ? upColor : downColor;

        if (gIdx === selectedIndex) {
          ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
          ctx.fillRect(i * candleW, 0, candleW, height);
          ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5;
          ctx.strokeRect(i * candleW, 0, candleW, height);
        }

        ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, getY(d.high)); ctx.lineTo(x, getY(d.low)); ctx.stroke();

        const yO = getY(d.open), yC = getY(d.close);
        ctx.fillStyle = color;
        ctx.fillRect(x - bodyW / 2, Math.min(yO, yC), bodyW, Math.max(2, Math.abs(yO - yC)));

        const vy = getVY(d.volume);
        ctx.fillStyle = isUp ? 'rgba(16, 185, 129, 0.4)' : 'rgba(239, 68, 68, 0.4)';
        ctx.fillRect(x - bodyW / 2, vy, bodyW, (volTop + volH) - vy);

        if (i % Math.max(1, Math.floor(visibleData.length / 7)) === 0) {
          ctx.fillStyle = '#64748b';
          ctx.fillText(d.date.substring(5), x - 12, height - 6);
        }
      }

      function drawMA(arr, color) {
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        let s = false;
        for (let i = 0; i < visibleData.length; i++) {
          const g = startIndex + i;
          if (arr[g] != null) {
            const x = i * candleW + candleW / 2, y = getY(arr[g]);
            if (!s) { ctx.moveTo(x, y); s = true; } else ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
      }
      drawMA(ma20, '#f59e0b'); drawMA(ma60, '#a855f7'); drawMA(ma120, '#10b981');
    }

    function updateAnalysisPanel(idx) {
      const series = database[currentTicker].series;
      const meta = database[currentTicker].meta;
      if (idx < 0 || idx >= series.length) return;
      selectedIndex = idx;
      const d = series[idx];

      document.getElementById('pDate').innerText = d.date;
      const pfx = meta.currency === "USD" ? "$" : "";
      const sfx = meta.currency === "KRW" ? "원" : "";

      document.getElementById('pClose').innerText = pfx + (meta.currency==="USD" ? d.close.toFixed(2) : Number(d.close).toLocaleString()) + sfx;

      const isUp = d.change >= 0;
      const diffElem = document.getElementById('pDiff');
      diffElem.innerText = `${isUp ? '+' : ''}${pfx}${meta.currency==="USD" ? d.change.toFixed(2) : Number(d.change).toLocaleString()} (${isUp ? '+' : ''}${d.pct_change.toFixed(2)}%)`;
      diffElem.style.color = isUp ? 'var(--up-green)' : 'var(--down-red)';

      const badgeElem = document.getElementById('pBadge');
      badgeElem.innerText = `${d.category} • ${d.sentiment}`;
      badgeElem.className = `badge ${isUp ? 'badge-up' : 'badge-down'}`;

      document.getElementById('pOpen').innerText = pfx + (meta.currency==="USD" ? d.open.toFixed(2) : Number(d.open).toLocaleString());
      document.getElementById('pHigh').innerText = pfx + (meta.currency==="USD" ? d.high.toFixed(2) : Number(d.high).toLocaleString());
      document.getElementById('pLow').innerText = pfx + (meta.currency==="USD" ? d.low.toFixed(2) : Number(d.low).toLocaleString());
      document.getElementById('pVol').innerText = (d.volume / 1e6).toFixed(1) + 'M';
      document.getElementById('pHeadline').innerText = d.headline;

      document.getElementById('pPillarCompany').innerText = isUp ? `${meta.name}의 실적 호조 및 핵심 사업부 수주 확대로 이익 가시성 개선.` : `${meta.name}의 실적 발표 후 단기 눈높이 미달 및 차익 실현 매물 출회.`;
      document.getElementById('pPillarIndustry').innerText = isUp ? "전방 산업의 AI 및 설비투자(CapEx) 확대 기조 지속에 따른 밸류체인 수혜." : "업종 전반의 밸류에이션 부담에 따른 기술주 동반 조정.";
      document.getElementById('pPillarMacro').innerText = isUp ? "기준금리 완화 정책 기대감 및 인플레이션 둔화로 위험선호 심리 확산." : "국채 금리 반등 및 거시경제 불확실성 노이즈로 인한 보수적 심리.";
      document.getElementById('pPillarTech').innerText = isUp ? "외국인 및 기관 동반 순매수 유입 및 주요 지지선 반등." : "기관 손절 물량 출회 및 단기 저점 탐색 과정.";
      document.getElementById('pTakeaway').innerText = isUp ? "주요 지지선 안착 후 우상향 추세 유지 여부 확인 필요." : "분할 매수 관점에서의 밸류에이션 하단 지지력 점검 유효.";

      renderChart();
    }

    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX - container.getBoundingClientRect().left;
      dragStartStartIndex = startIndex;
    });

    container.addEventListener('mouseup', (e) => {
      const series = database[currentTicker].series;
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const chartWidth = rect.width - 75;
      const candleW = chartWidth / Math.min(series.length, visibleCount);

      if (Math.abs(e.clientX - rect.left - dragStartX) < 5) {
        const rel = Math.floor(x / candleW);
        if (rel >= 0 && rel < visibleCount) {
          updateAnalysisPanel(startIndex + rel);
        }
      }
      isDragging = false;
    });

    container.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const delta = Math.round((dragStartX - (e.clientX - container.getBoundingClientRect().left)) / 15);
        startIndex = Math.max(0, Math.min(database[currentTicker].series.length - visibleCount, dragStartStartIndex + delta));
        renderChart();
      }
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) visibleCount = Math.max(25, visibleCount - 8);
      else visibleCount = Math.min(database[currentTicker].series.length, visibleCount + 8);
      startIndex = Math.max(0, Math.min(database[currentTicker].series.length - visibleCount, startIndex));
      renderChart();
    });

    function jumpToDate(dateStr) {
      const s = database[currentTicker].series;
      const idx = s.findIndex(d => d.date === dateStr);
      if (idx !== -1) {
        startIndex = Math.max(0, Math.min(s.length - visibleCount, Math.floor(idx - visibleCount / 2)));
        updateAnalysisPanel(idx);
      }
    }
    function resetZoom() { visibleCount = database[currentTicker].series.length; startIndex = 0; renderChart(); }
    function zoomIn() { visibleCount = Math.max(25, Math.floor(visibleCount * 0.7)); renderChart(); }
    function zoomOut() { visibleCount = Math.min(database[currentTicker].series.length, Math.floor(visibleCount * 1.3)); renderChart(); }
    function toggleColorMode() {
      isKoreanColor = !isKoreanColor;
      document.getElementById('colorToggleBtn').innerText = isKoreanColor ? '🎨 한국식(적/청)' : '🎨 미국식(녹/적)';
      updateAnalysisPanel(selectedIndex);
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { searchDropdown.style.display = 'none'; return; }
      const matches = Object.keys(database).filter(tk => {
        const m = database[tk].meta;
        return tk.toLowerCase().includes(q) || m.name.toLowerCase().includes(q);
      });
      if (matches.length === 0) { searchDropdown.style.display = 'none'; return; }
      searchDropdown.innerHTML = matches.map(tk => `
        <div class="search-item" onclick="selectEntity('${tk}'); searchDropdown.style.display='none'; searchInput.value='';">
          <span><b>${database[tk].meta.name}</b> (${tk})</span>
          <span style="font-size:11px; color:#3b82f6;">${database[tk].meta.category}</span>
        </div>
      `).join('');
      searchDropdown.style.display = 'block';
    });

    loadData();
  </script>
</body>
</html>
